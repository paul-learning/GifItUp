# Hand-maintained. Do NOT regenerate with updateDaemonJvm (it would add toolchainUrl download entries).
# Gradle daemon JVM: JDK 21 (Temurin/Adoptium), same as CI and jvmToolchain(21).
# No toolchainUrl entries on purpose: the JDK must already be installed; Gradle never downloads one.
toolchainVendor=ADOPTIUM
toolchainVersion=21
