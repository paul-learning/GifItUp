version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (security updates are not delayed).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # KGP, serialization and Compose compiler plugins share the Kotlin version and must move together.
      kotlin:
        patterns: ['org.jetbrains.kotlin*']
      ktor:
        patterns: ['io.ktor*']
      compose:
        patterns: ['org.jetbrains.compose*']

  # crypto/Cargo.toml (OpenMLS, uniffi). The Rust toolchain, NDK and cargo-ndk pins are bumped by hand.
  - package-ecosystem: cargo
    directory: /crypto
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (security updates are not delayed).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # deploy/docker-compose.yml: digest-pinned Postgres image (ADR-0005).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A Postgres major upgrade needs dump + restore (the data path is per major version); never auto-propose it.
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']

  # server/Dockerfile: digest-pinned distroless Java base image (#7).
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (security updates are not delayed).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
