name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gradle:
    name: Gradle check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the Gradle wrapper checksum. Only main writes the cache, so PRs cannot poison it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # check = all tests (jvm, Android host, wasmJs/Node, server) + ktlint + detekt + Android lint.
      - name: Check, Android debug APK, wasmJs production bundle
        run: >-
          ./gradlew --continue
          check
          :androidApp:assembleDebug
          :composeApp:wasmJsBrowserDistribution

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: '*/build/reports/'
          retention-days: 7

  crypto:
    name: Rust crypto crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Placeholder until the crate exists (#3, #4, #11): the job passes and the steps below are skipped.
      - name: Detect crate
        id: detect
        run: |
          if [ -f crypto/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # rustup is preinstalled on the runner, so no third-party toolchain action is needed.
      - name: Install Rust components
        if: steps.detect.outputs.present == 'true'
        run: rustup component add rustfmt clippy

      - name: cargo fmt --check
        if: steps.detect.outputs.present == 'true'
        working-directory: crypto
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        if: steps.detect.outputs.present == 'true'
        working-directory: crypto
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        if: steps.detect.outputs.present == 'true'
        working-directory: crypto
        run: cargo test --locked
