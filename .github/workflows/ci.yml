name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  # PRs share one group per branch, so superseded runs are cancelled.
  # Every other run (main, schedule) gets its own group per commit, so no commit on main goes unchecked.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gradle:
    name: Gradle check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Must equal the wasm-bindgen crate version in crypto/Cargo.lock (enforced by scripts/check-repo-hygiene.sh).
      WASM_BINDGEN_VERSION: 0.2.129
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the Gradle wrapper checksum. Only main writes the cache, so PRs cannot poison it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source cache implementation instead of the default closed-source one.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Guards against verification being weakened or switched off (#38 SEC-1, SEC-7); see docs/dependencies.md.
      # Same coordinates must mean same bytes: a second trusted checksum for an artifact is a red flag.
      - name: Guard dependency verification config
        run: |
          meta=gradle/verification-metadata.xml
          fail() { echo "::error::$1; see docs/dependencies.md"; exit 1; }
          [ -f "$meta" ] || fail "$meta is missing"
          grep -q "<verify-metadata>true</verify-metadata>" "$meta" || fail "$meta does not enable verify-metadata"
          if grep -n "<also-trust" "$meta"; then fail "$meta contains <also-trust> entries"; fi
          trust=$(grep "<trust " "$meta" | tr -d ' ')
          [ "$trust" = '<trustfile=".*-(sources|javadoc)[.]jar"regex="true"/>' ] \
            || fail "$meta trusts artifacts beyond the IDE sources/javadoc rule"
          # Mode overrides: the Gradle property (also as -D), the long CLI flag, or -F (also on a folded continuation line).
          # The [n] keeps the pattern from matching this script.
          if grep -rnE 'dependency[.-]verificatio[n][[:space:]=]' gradle.properties .github/workflows/ \
            || grep -rnE '(gradlew.*[[:space:]]|^[[:space:]]*)-F([[:space:]=]|$)' .github/workflows/; then
            fail "dependency verification mode is overridden"
          fi

      # Mechanical review findings (file modes, IDE artifacts, matching pins); see docs/review-lessons.md.
      - name: Repo hygiene
        run: |
          bash scripts/check-repo-hygiene.sh
          bash scripts/test-deploy-web-for.sh
          bash scripts/test-release-version.sh
          bash scripts/test-check-network-config.sh

      # :mls builds crypto/ (ADR-0007): rustup is preinstalled and crypto/rust-toolchain.toml pins the toolchain
      # and targets. Installing it once here keeps parallel cargo calls from installing it concurrently (#67 CR-1).
      - name: Install the pinned Rust toolchain
        working-directory: crypto
        # Explicit install from rust-toolchain.toml; relying on rustup's implicit auto-install is deprecated (#67 CR-8).
        run: rustup toolchain install && rustup show active-toolchain && cargo --version

      # wasm-bindgen-cli is a prebuilt release binary, verified against a pinned SHA-256.
      - name: Install wasm-bindgen-cli
        run: |
          name="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/wb.tgz"             "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${name}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  $RUNNER_TEMP/wb.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wb.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"

      # check = all tests (jvm, Android host, wasmJs/Node, server, :mls contract tests on the JVM and in
      # headless Chrome, which the runner ships) + ktlint + detekt + Android lint.
      # The Android APKs need cargo-ndk for crypto/'s .so files and are built in the "MLS bindings" job.
      - name: Check, wasmJs production bundle
        run: >-
          ./gradlew --continue
          -Pgifitup.defaultOrigin=https://ci.gifitup.example
          check
          :composeApp:wasmJsBrowserDistribution

      # What ships: no test-only panic trigger anywhere in the bundle, and no build-machine paths in its wasm
      # files (ADR-0007; #67 SEC-1, SEC-3, CR-6).
      - name: Scan the web bundle
        run: |
          dist=composeApp/build/dist/wasmJs/productionExecutable
          ls "$dist"/*.wasm
          # grep exits 0 = found (fail), 1 = not found (ok), 2 = read error (fail).
          rc=0; grep -rlaF gifitup_test_panic_marker "$dist" || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::test-panic code in the web bundle (or scan error $rc)"; exit 1; }
          rc=0; grep -laF "$HOME" "$dist"/*.wasm || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::build-machine paths in the web bundle (or scan error $rc)"; exit 1; }
          # No dev CLI code (AGENTS.md "Dev CLI"; #79, #102 SEC-13): its usage text and package, as UTF-8 or UTF-16.
          # Kotlin/Wasm keeps a package name as its own string ("app.gifitup.cli", no trailing dot; #103 SEC-17). The
          # control is the app's own package prefix in that form, required in the .wasm files themselves (SEC-18).
          python3 scripts/scan-artifact.py --control "app.gifitup" \
            --forbid "usage: gifitup-cli" --forbid "app/gifitup/cli" --forbid "app.gifitup.cli" "$dist"/*.wasm
          python3 scripts/scan-artifact.py --control "app.gifitup" \
            --forbid "usage: gifitup-cli" --forbid "app/gifitup/cli" --forbid "app.gifitup.cli" "$dist"

      # The bundle the web-edge job serves through the real Caddy site block (#27).
      - name: Upload web bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: composeApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
          retention-days: 1

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          # build/reports/dependency-verification/ lists artifacts missing from gradle/verification-metadata.xml.
          path: |
            build/reports/
            */build/reports/
          retention-days: 7

  # The web app behind the edge (#27 SEC-7, SEC-8, SEC-9): the real bundle, served by the web image's Caddyfile behind
  # the committed site block (host swapped for localhost), opened in headless Chrome. The policy is only worth
  # something if the app starts under it, so any CSP violation fails the job. No secrets, read-only token.
  web-edge:
    name: Web bundle behind the edge
    needs: gradle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download web bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: composeApp/build/dist/wasmJs/productionExecutable/

      - name: Start the edge
        run: |
          image=$(sed -n 's/^FROM \(caddy:[^ ]*\).*/\1/p' deploy/web/Dockerfile)
          [ -n "$image" ] || { echo "::error::no caddy base image in deploy/web/Dockerfile"; exit 1; }
          docker build --file deploy/web/Dockerfile --tag web-under-test .
          docker network create edge
          # With the compose service's hardening (deploy/docker-compose.yml), so a binary that can't start there fails here.
          docker run -d --name gifitup-web --network edge --network-alias gifitup-web \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true --user 10001:10001 \
            --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 --tmpfs /config:uid=10001,gid=10001 -e XDG_DATA_HOME=/data -e XDG_CONFIG_HOME=/config web-under-test
          # Stand-in for the server: the edge only needs something to answer at its address.
          mkdir stub
          printf ':8080 {\n\trespond 200\n}\n' > stub/Caddyfile
          docker run -d --name gifitup-server --network edge --network-alias gifitup-server \
            -v "$PWD/stub/Caddyfile:/etc/caddy/Caddyfile:ro" "$image"
          # The committed site block with its host swapped for a local plain-http address.
          sed 's/^gifitup\.example\.com {/http:\/\/localhost:8000 {/' deploy/caddy/gifitup.caddy > stub/edge.caddy
          grep -q '^http://localhost:8000 {' stub/edge.caddy
          printf '{\n\tadmin off\n}\nimport /etc/caddy/edge.caddy\n' > stub/Caddyfile.edge
          docker run -d --name edge --network edge -p 8000:8000 \
            -v "$PWD/stub/Caddyfile.edge:/etc/caddy/Caddyfile:ro" -v "$PWD/stub/edge.caddy:/etc/caddy/edge.caddy:ro" "$image"
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8000/health && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:8000/health

      - name: Headers
        run: |
          bash scripts/check-web-headers.sh http://localhost:8000
          # The check itself must refuse a broken edge (#249 CR-3).
          bash scripts/test-check-web-headers.sh

      - name: No eval in the bundle
        run: |
          # 'unsafe-eval' stays out of the policy, so the bundle must not need it (SEC-7). grep: 1 = none found.
          # One known use is allowed: webpack's globalThis shim `this||new Function("return this")()` in a try block. It
          # runs only when `this` is unset, and a refusal is caught; the Chrome step below fails if it ever fires.
          rc=0
          grep -rEoh --include='*.js' '(^|[^A-Za-z0-9_.$])(eval\(|new Function\([^)]*\))' composeApp/build/dist/wasmJs/productionExecutable > evals.txt || rc=$?
          [ "$rc" -le 1 ] || { echo "::error::scan error $rc"; exit 1; }
          sed -E 's/^[^en]*//' evals.txt | grep -vxF 'new Function("return this")' || true
          if sed -E 's/^[^en]*//' evals.txt | grep -qvxF 'new Function("return this")'; then
            echo "::error::eval or new Function in the web bundle"; exit 1
          fi

      # Drives Chrome over its DevTools port: waits for the app's canvas and fails on any Content-Security-Policy
      # violation the browser reports (scripts/check-web-app-starts.py).
      - name: Open the app in headless Chrome
        run: python3 -I scripts/check-web-app-starts.py "$(command -v google-chrome)" http://localhost:8000/ 90

      - name: Container logs on failure
        if: failure()
        run: docker logs edge | tail -n 50; docker logs gifitup-web | tail -n 50

  # deploy/deploy.sh runs as a forced command on the VM and deploy.yml holds deploy credentials (#48).
  # Prebuilt release binaries, verified against pinned SHA-256 digests (the ones GitHub lists for the release asset).
  # The runner image ships its own shellcheck, so the pinned one is put first on PATH.
  shell-and-workflow-lint:
    name: shellcheck + actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck and actionlint
        run: |
          bin="$RUNNER_TEMP/lint-bin"
          mkdir -p "$bin"
          curl -sSfL -o "$RUNNER_TEMP/sc.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/sc.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          curl -sSfL -o "$RUNNER_TEMP/al.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/al.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"

      # Every tracked *.sh file and the git hooks. gradlew is generated by Gradle and not ours to lint.
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' '.githooks/*' | xargs -0 --no-run-if-empty shellcheck

      # Also runs the pinned shellcheck over every workflow `run:` block. An empty -pyflakes= keeps the
      # runner's unpinned pyflakes out (no `shell: python` steps today).
      - name: actionlint
        run: |
          actionlint -version
          actionlint -shellcheck "$(command -v shellcheck)" -pyflakes=

      # The REST write path for cloud sessions (#96), against a fake gh; it never reaches GitHub. Linux has
      # symlinks, so the symlink cases must run here (they're skipped on Git Bash for Windows).
      - name: gh-rest.sh tests
        env:
          GH_REST_TEST_REQUIRE_SYMLINKS: '1'
        run: bash scripts/test-gh-rest.sh

  crypto:
    name: Rust crypto crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The crate exists now: a missing crate is an error, not a skip (SEC-5 on #35).
      # rustup is preinstalled; crypto/rust-toolchain.toml pins the version, components and targets,
      # and rustup installs them on the first cargo call. No third-party toolchain action needed.
      - name: Install and show the pinned Rust toolchain
        working-directory: crypto
        run: rustup toolchain install && rustup show active-toolchain && cargo --version

      # Only main writes this cache (restore-only on PRs, like the Gradle cache), so a PR can't poison it.
      # Release builds (#27) must not use it.
      - name: Restore cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-deny
            crypto/target
          key: crypto-${{ runner.os }}-deny${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('crypto/Cargo.lock', 'crypto/rust-toolchain.toml') }}

      # Dependency audit: advisories, yanked crates, licenses, sources, banned OpenMLS features
      # (crypto/deny.toml; #35 SEC-5, #36 SEC-8). Pinned version, built from crates.io with its lockfile.
      - name: Install cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -qxF "cargo-deny ${CARGO_DENY_VERSION}"; then
            cargo install cargo-deny --locked --version "${CARGO_DENY_VERSION}"
          fi
          cargo deny --version

      - name: cargo deny check
        working-directory: crypto
        run: cargo deny --locked check

      - name: cargo fmt --check
        working-directory: crypto
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        working-directory: crypto
        run: cargo clippy --all-targets --locked -- -D warnings

      # The wasm-bindgen layer (src/wasm_api.rs) only compiles for wasm32.
      - name: cargo clippy -D warnings (wasm32)
        working-directory: crypto
        run: cargo clippy --target wasm32-unknown-unknown --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: crypto
        run: cargo test --locked

      # The test-only panic trigger used by the :mls panic and trap tests (debug builds only, ADR-0007).
      - name: cargo clippy and test with the test-panic feature
        working-directory: crypto
        run: |
          cargo clippy --all-targets --locked --features test-panic -- -D warnings
          cargo test --locked --features test-panic

      - name: Save cargo cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-deny
            crypto/target
          key: crypto-${{ runner.os }}-deny${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('crypto/Cargo.lock', 'crypto/rust-toolchain.toml') }}

  # Android side of crypto/ (ADR-0007): cargo-ndk release build of the .so files, the debug and release APKs that
  # ship them, and the check that no test-only code is in them. The JVM and browser bindings are built and tested
  # in the Gradle check job.
  mls-bindings:
    name: MLS bindings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install the pinned Rust toolchain
        working-directory: crypto
        run: rustup toolchain install && rustup show active-toolchain

      - name: Install cargo-ndk
        working-directory: crypto
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Build the Android libraries and APKs
        run: ./gradlew -Pgifitup.defaultOrigin=https://ci.gifitup.example :mls:cargoNdkBuild :mls:verifyNoTestPanicAndroid :androidApp:assembleDebug :androidApp:assembleRelease

      # What ships: the crypto library for every ABI, without the test-only panic trigger or build-machine paths
      # (ADR-0007; #67 SEC-1, SEC-3).
      - name: Scan the APKs
        run: |
          for apk in androidApp/build/outputs/apk/debug/*.apk androidApp/build/outputs/apk/release/*.apk; do
            for abi in arm64-v8a x86_64; do
              so="lib/${abi}/libgifitup_crypto.so"
              lib="$RUNNER_TEMP/scan.so"
              rm -f "$lib"
              unzip -p "$apk" "$so" > "$lib" || { echo "::error::$apk lacks ${abi}"; exit 1; }
              [ -s "$lib" ] || { echo "::error::$apk lacks ${abi}"; exit 1; }
              # grep exits 0 = found (fail), 1 = not found (ok), 2 = read error (fail).
              for needle in gifitup_test_panic_marker "$HOME"; do
                rc=0; grep -qaF "$needle" "$lib" || rc=$?
                [ "$rc" -eq 1 ] || { echo "::error::$apk ($abi): found '$needle' (or scan error $rc)"; exit 1; }
              done
            done
            # No dev CLI code in the app's classes (AGENTS.md "Dev CLI"; #79, #102 SEC-13). The control is the app's
            # own class-name prefix in the same form as the forbidden one (#103 SEC-18; minification is off).
            dex="$RUNNER_TEMP/dex"
            rm -rf "$dex" && mkdir "$dex"
            unzip -q "$apk" 'classes*.dex' -d "$dex"
            python3 scripts/scan-artifact.py --control "Lapp/gifitup/" \
              --forbid "usage: gifitup-cli" --forbid "app/gifitup/cli" --forbid "app.gifitup.cli" "$dex"/classes*.dex
          done

      # The release workflow's APK assertions (#27 PR 2), run on the unsigned release APK of this build (version 1, 0.1.0,
      # the CI origin), so a change that breaks them fails here and not on the first tag.
      - name: Assert the release APK
        run: |
          apk=$(find androidApp/build/outputs/apk/release -name '*-release-unsigned.apk')
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          bash scripts/scan-android-apk.sh "$apk"
          # The release workflow signs the build's APK as it is, so it must come out of Gradle aligned (#251 CR-2).
          zipalign=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)
          "$zipalign" -c 4 "$apk"
          PATH="$(dirname "$aapt2"):$PATH" bash scripts/assert-release-apk.sh "$apk" ci.gifitup.example 1 0.1.0
