name: Deploy

# Builds the server image from main, pushes it to GHCR with build provenance, and deploys it to the VM once the
# owner approves the `production` environment. Design and threat analysis: docs/ops/deploy.md, round-0 security
# review on #7. Rollback/redeploy: run this workflow on main with `commit` set to an earlier deployed commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Rollback/redeploy: full 40-character commit SHA on main whose image to deploy (empty = build HEAD)'
        required: false
        default: ''

permissions: {}

env:
  IMAGE: ghcr.io/paul-learning/gifitup-server
  WEB_IMAGE: ghcr.io/paul-learning/gifitup-web

jobs:
  # Runs Gradle (third-party build code) with a read-only token only; no registry credentials in this job.
  build:
    name: Build server distribution
    if: github.ref == 'refs/heads/main' && inputs.commit == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # No Actions cache: cached task outputs aren't covered by dependency verification, and other main-branch
      # jobs could write poisoned entries. The release build starts clean (#7 round-0 SEC-4).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build server distribution
        run: ./gradlew --no-build-cache --no-configuration-cache :server:installDist

      - name: Upload server distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-dist
          path: server/build/install/
          if-no-files-found: error
          retention-days: 1

  # The web bundle (#27), built next to the server distribution with the same rules: third-party build code, a read-only
  # token, no secrets, no cache. Needs the repository variable GIFITUP_PUBLIC_URL (the canonical origin of the
  # server, ADR-0009); without it no web image is made and the release ships the server only.
  build-web:
    name: Build web bundle
    if: github.ref == 'refs/heads/main' && inputs.commit == '' && vars.GIFITUP_PUBLIC_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Must equal the wasm-bindgen crate version in crypto/Cargo.lock (scripts/check-repo-hygiene.sh).
      WASM_BINDGEN_VERSION: 0.2.129
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
      ORIGIN: ${{ vars.GIFITUP_PUBLIC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Install the pinned Rust toolchain
        working-directory: crypto
        run: rustup toolchain install && rustup show active-toolchain && cargo --version

      - name: Install wasm-bindgen-cli
        run: |
          name="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/wb.tgz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${name}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  $RUNNER_TEMP/wb.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wb.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"

      # The bundle's server origin is the variable, checked here against the canonical form the server demands
      # (ADR-0009: https, lowercase host, no port 443, no path); the Gradle task checks it again.
      - name: Build the web bundle
        run: |
          [[ "$ORIGIN" =~ ^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*(:[1-9][0-9]{0,4})?$ ]] \
            || { echo "::error::GIFITUP_PUBLIC_URL is not a canonical https origin"; exit 1; }
          ./gradlew --no-build-cache --no-configuration-cache "-Pgifitup.defaultOrigin=$ORIGIN" :composeApp:wasmJsBrowserDistribution

      # Same scans as CI on what ships (ADR-0007, #67, #79).
      - name: Scan the web bundle
        run: |
          dist=composeApp/build/dist/wasmJs/productionExecutable
          ls "$dist"/*.wasm
          rc=0; grep -rlaF gifitup_test_panic_marker "$dist" || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::test-panic code in the web bundle (or scan error $rc)"; exit 1; }
          rc=0; grep -laF "$HOME" "$dist"/*.wasm || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::build-machine paths in the web bundle (or scan error $rc)"; exit 1; }
          rc=0; grep -rlaF "gifitup.invalid" "$dist" || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::the placeholder origin is in the web bundle (or scan error $rc)"; exit 1; }
          python3 scripts/scan-artifact.py --control "app.gifitup" \
            --forbid "usage: gifitup-cli" --forbid "app/gifitup/cli" --forbid "app.gifitup.cli" "$dist"/*.wasm
          python3 scripts/scan-artifact.py --control "app.gifitup" \
            --forbid "usage: gifitup-cli" --forbid "app/gifitup/cli" --forbid "app.gifitup.cli" "$dist"

      - name: Upload web bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: composeApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
          retention-days: 1

  # Only docker build/push and the first-party attestation action run next to the package token.
  push:
    name: Push image
    needs: [build, build-web]
    # build-web is skipped without the GIFITUP_PUBLIC_URL variable: the release then has no web image.
    if: github.ref == 'refs/heads/main' && inputs.commit == '' && !cancelled() && needs.build.result == 'success' && (needs.build-web.result == 'success' || needs.build-web.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download server distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-dist
          path: server/build/install/

      - name: Download web bundle
        if: needs.build-web.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: composeApp/build/dist/wasmJs/productionExecutable/

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # The web image first: its digest goes into the server image's label, and one attested server digest then names
      # both (deploy/deploy.sh reads the label). One plain manifest, as below.
      - name: Build and push web image
        id: push-web
        if: needs.build-web.result == 'success'
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build --provenance=false --sbom=false --build-arg "REVISION=$SHA" \
            --file deploy/web/Dockerfile --tag "$WEB_IMAGE:$SHA" .
          digest=$(docker push "$WEB_IMAGE:$SHA" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)
          registry=$(docker buildx imagetools inspect "$WEB_IMAGE:$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || [ "$digest" != "$registry" ]; then
            echo "::error::pushed web digest '$digest' does not match the registry's '$registry'"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest web image provenance
        if: needs.build-web.result == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.push-web.outputs.digest }}
          push-to-registry: true

      # One plain manifest (no provenance/SBOM index from buildx), so the pushed digest is the one we attest and deploy.
      - name: Build and push image
        id: push
        env:
          SHA: ${{ github.sha }}
          WEB_DIGEST: ${{ steps.push-web.outputs.digest }}
        run: |
          web=""
          if [ -n "$WEB_DIGEST" ]; then web="$WEB_IMAGE@$WEB_DIGEST"; fi
          docker build --provenance=false --sbom=false --build-arg "REVISION=$SHA" --build-arg "WEB_IMAGE=$web" \
            --file server/Dockerfile --tag "$IMAGE:$SHA" .
          digest=$(docker push "$IMAGE:$SHA" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)
          registry=$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || [ "$digest" != "$registry" ]; then
            echo "::error::pushed digest '$digest' does not match the registry's '$registry'"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  deploy:
    name: Deploy to VM
    needs: push
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() &&
      (needs.push.result == 'success' || (needs.push.result == 'skipped' && inputs.commit != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewer = owner, admin bypass off, deployment branches = main (docs/ops/deploy.md).
    environment: production
    # Only the deploy step is serialised, so images for every main commit still get built and stay rollback targets.
    # GitHub keeps one pending run per group: a newer deploy replaces an older one that is still waiting.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Resolve commit and digest
        id: target
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          PUSHED_DIGEST: ${{ needs.push.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_COMMIT" ]; then
            commit=$INPUT_COMMIT
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-character SHA"; exit 1; }
            digest=$(docker buildx imagetools inspect "$IMAGE:$commit" --format '{{json .Manifest}}' | jq -r .digest)
          else
            commit=$SHA
            digest=$PUSHED_DIGEST
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no valid image digest for $commit"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '| commit | image digest |\n|---|---|\n| %s | %s |\n' "$commit" "$digest" >> "$GITHUB_STEP_SUMMARY"

      # Only images built by this workflow from main at exactly this commit can be deployed (#7 round-0 SEC-2).
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.target.outputs.commit }}
          DIGEST: ${{ steps.target.outputs.digest }}
        run: >-
          gh attestation verify "oci://$IMAGE@$DIGEST"
          --repo paul-learning/GifItUp
          --signer-workflow paul-learning/GifItUp/.github/workflows/deploy.yml
          --source-ref refs/heads/main
          --source-digest "$COMMIT"
          --deny-self-hosted-runners

      # deploy.sh is the key's forced command on the VM: it only accepts "<commit> <digest>" (docs/ops/deploy.md).
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          COMMIT: ${{ steps.target.outputs.commit }}
          DIGEST: ${{ steps.target.outputs.digest }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            "deploy@$DEPLOY_HOST" "$COMMIT $DIGEST"

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
