name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday 04:23 UTC

permissions:
  contents: read

concurrency:
  # Same scheme as ci.yml: cancel superseded PR runs, one group per commit otherwise.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # crypto/ (OpenMLS wrapper); Rust is extracted from source without a build.
          - language: rust
            build-mode: none
          # Kotlin needs a real compile for extraction (build-mode none only covers Java).
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      # Rust extraction runs dependency build scripts and proc macros (rust-analyzer), and the Kotlin build
      # compiles crypto/ for the :mls bindings. Fetch exactly the crates in Cargo.lock first, then keep cargo
      # offline while CodeQL builds and runs (#45 SEC-5, #66 SEC-2).
      - name: Fetch locked Rust dependencies
        if: matrix.language == 'rust' || matrix.build-mode == 'manual'
        working-directory: crypto
        run: cargo fetch --locked

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        env:
          CARGO_NET_OFFLINE: 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Compile every JVM/Android Kotlin source set from scratch so the extractor sees it (no build cache).
      # The Kotlin compiler runs in-process (no Kotlin daemon) so CodeQL's build tracer observes it.
      - name: Build for CodeQL
        if: matrix.build-mode == 'manual'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process
          :protocol:compileKotlinJvm :protocol:compileAndroidMain
          :shared:compileKotlinJvm :shared:compileAndroidMain
          :mls:compileKotlinJvm :mls:compileAndroidMain
          :composeApp:compileAndroidMain
          :androidApp:compileDebugKotlin
          :server:compileKotlin

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        env:
          CARGO_NET_OFFLINE: 'true'
        with:
          category: /language:${{ matrix.language }}
