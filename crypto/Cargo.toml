[package]
name = "gifitup-crypto"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "GifItUp E2EE core: OpenMLS wrapper with uniffi (Android/JVM) and wasm-bindgen (web) bindings (ADR-0007)"

[lib]
name = "gifitup_crypto"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
openmls = "0.9.1"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_memory_storage = "0.6.0"
openmls_traits = "0.6.0"
thiserror = "2"

# Android / JVM: uniffi bindings.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = "0.32.2"

# Browser: wasm-bindgen bindings; OpenMLS "js" feature = getrandom via crypto.getRandomValues + web-time.
[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "0.9.1", features = ["js"] }
# Exact pin: must match the wasm-bindgen-cli binary pinned (version + SHA-256) in .github/workflows/ci.yml
# (enforced by scripts/check-repo-hygiene.sh).
wasm-bindgen = "=0.2.129"
# rand_core 0.6 (via openmls_rust_crypto's RustCrypto RNG and RustCrypto curves) uses getrandom 0.2,
# which needs its "js" feature (crypto.getRandomValues) on wasm32-unknown-unknown. Not used directly.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

# Size/complexity limits (default thresholds); CI runs clippy with -D warnings. See the periodic architecture review in CLAUDE.md.
[lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Unwind so a Rust panic can be caught (error::PanicGuard) instead of killing the app (SEC-1 on #36, ADR-0007).
panic = "unwind"
# Arithmetic overflow panics (-> ErrorCode::Poisoned) instead of wrapping silently (ADR-0007).
overflow-checks = true
