[package]
name = "gifitup-crypto"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "GifItUp E2EE core: OpenMLS wrapper with uniffi bindings (SPIKE quality, see docs/spikes/openmls-android.md)"

[lib]
name = "gifitup_crypto"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
openmls = "0.9.1"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
uniffi = "0.32.2"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Unwind so uniffi turns a Rust panic into a Kotlin exception instead of killing the app (SEC-1 on #36).
panic = "unwind"
