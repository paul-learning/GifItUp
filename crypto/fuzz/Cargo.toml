[package]
name = "gifitup-crypto-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for the parse paths of gifitup-crypto (#64). Dev tool, never built by Gradle or shipped."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.12"
gifitup-crypto = { path = "..", default-features = false }

# Outside the crate's workspace: its own lockfile, never part of a build of ours.
[workspace]
members = ["."]

# Same arithmetic checks and unwinding as the shipped release profile (ADR-0007).
[profile.release]
debug = 1
overflow-checks = true
panic = "unwind"

[[bin]]
name = "key_package_bytes"
path = "fuzz_targets/key_package_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hostile_key_package"
path = "fuzz_targets/hostile_key_package.rs"
test = false
doc = false
bench = false

