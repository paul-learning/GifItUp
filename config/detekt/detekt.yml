# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
style:
  MaxLineLength:
    # Keep in sync with max_line_length in .editorconfig (ktlint).
    maxLineLength: 140
  ForbiddenImport:
    # Domain purity (ARCH-M0-6, CLAUDE.md "Layering"): shared's domain code imports only the Kotlin standard library,
    # kotlinx.coroutines and shared's own domain and data packages (domain -> data is allowed: owner decision on #133,
    # 2026-10-21). An allow-list, so a new framework import fails here instead of slipping past a list of known ones;
    # the platform parts of the allowed libraries (kotlin.js/jvm/wasm/native, kotlinx.coroutines.android and the like)
    # are excluded too. Import lines only: a fully qualified name in code is not checked.
    active: true
    includes: ['**/shared/src/commonMain/kotlin/app/gifitup/shared/domain/**']
    forbiddenPatterns: '^(?!kotlin\.(?!(js|jvm|wasm|native)\.)|kotlinx\.coroutines\.(?!(android|swing|javafx|test|debug|internal)\.)|app\.gifitup\.shared\.(domain|data)\.)'
